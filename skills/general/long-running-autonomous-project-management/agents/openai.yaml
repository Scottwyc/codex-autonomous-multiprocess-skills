display_name: Long-Running Autonomous Project Management
short_description: Sustained autonomous follow-up with workers and a clickable results dashboard.
default_prompt: Use this skill when a project needs sustained autonomous follow-up. Keep the coordinator on short bounded checks and compact coordinator memory, maintain unified coordinator constraints before launching workers, use tmux-managed Codex workers by default, register tmux-hosted coordinators for recovery, use branch-manager workers for major experimental branches, use manager-mediated peer messages for front-line workers, maintain a concise user-facing key-results dashboard with clickable links, update status and exploration docs continuously, and derive a project-specific skill only when stable project rules justify it. When deriving, explicitly state the derived skill name and its specialization.
